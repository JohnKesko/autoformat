[package]
name = "autoformat-cli"
description = "The autoformat command line tool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "autoformat"
path = "src/main.rs"

[dependencies]
autoformat-config.workspace = true
autoformat-core.workspace = true
autoformat-languages.workspace = true

# `autoformat upgrade` only.
ureq.workspace = true
sha2.workspace = true
self-replace.workspace = true

[target.'cfg(unix)'.dependencies]
flate2.workspace = true
tar.workspace = true

[target.'cfg(windows)'.dependencies]
zip.workspace = true
# zip needs flate2 to unpack .zip files, but does not pick how flate2 does the work.
# Listing flate2 here gives it its default pure Rust backend, the same as on macOS and Linux.
flate2.workspace = true

[dev-dependencies]
flate2.workspace = true
tar.workspace = true
