name: Build & Release

# Every push to master runs the tests. When the version in vscode/extension/package.json
# does not have a git tag yet, this workflow also:
#   1. builds the autoformat binary for every platform,
#   2. packages one VS Code extension per platform,
#   3. publishes them to the VS Code Marketplace with Trusted Publishing: GitHub proves to
#      the Marketplace that this workflow is running, so no token is stored anywhere,
#   4. creates the tag and a GitHub release with the extensions, the command line archives
#      and SHA256SUMS.txt,
#   5. installs the command line tool with install.sh / install.ps1 on Linux, macOS and
#      Windows, straight from that release, to prove the install scripts work.
# The Zed extension (zed/extension) needs no step here: it downloads the command line
# archives of the newest GitHub release by itself.
# To release: raise the version in vscode/extension/package.json and Cargo.toml, then push.
#
# Run this workflow by hand with "check sign-in only" to test the Marketplace sign-in
# without building or publishing anything, or with "build only" to build and package
# every platform without publishing.
on:
  push:
    branches: [master]
    # Pushes that only change documentation do not start this workflow.
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "vscode/extension/LICENSE"
  workflow_dispatch:
    inputs:
      check_sign_in_only:
        description: "Only check that GitHub can sign in to the Marketplace (nothing is built or published)"
        type: boolean
        default: false
      build_only:
        description: "Build and package every platform, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sign-in-check:
    name: Check Marketplace sign-in
    if: inputs.check_sign_in_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Sign in to the Marketplace with Trusted Publishing
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/vsce" @vscode/vsce@4.1.0
          node -e "
            const publisher = require('./vscode/extension/package.json').publisher;
            const oidc = require(process.env.RUNNER_TEMP + '/vsce/node_modules/@vscode/vsce/out/oidc.js');
            oidc.getOIDCCredential(publisher).then(
              () => console.log('Signed in to the Marketplace as publisher ' + publisher + '.'),
              (error) => { console.error(error.message); process.exit(1); }
            );
          "

  tests:
    if: ${{ !inputs.check_sign_in_only }}
    uses: ./.github/workflows/ci.yml

  version:
    name: Check version
    if: ${{ !inputs.check_sign_in_only }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: read
        run: |
          version=$(node -p "require('./vscode/extension/package.json').version")
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Version mismatch: package.json has $version but Cargo.toml has $cargo_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already released; nothing to publish."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.rust_target }}
    needs: [tests, version]
    if: needs.version.outputs.release == 'true' || inputs.build_only
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, rust_target: x86_64-pc-windows-msvc, vscode_targets: win32-x64, exe: autoformat.exe, smoke_test: true }
          - { os: windows-11-arm, rust_target: aarch64-pc-windows-msvc, vscode_targets: win32-arm64, exe: autoformat.exe, smoke_test: true }
          - { os: macos-latest, rust_target: aarch64-apple-darwin, vscode_targets: darwin-arm64, exe: autoformat, smoke_test: true }
          - { os: macos-latest, rust_target: x86_64-apple-darwin, vscode_targets: darwin-x64, exe: autoformat, smoke_test: false }
          - { os: ubuntu-latest, rust_target: x86_64-unknown-linux-musl, vscode_targets: "linux-x64 alpine-x64", exe: autoformat, smoke_test: true }
          - { os: ubuntu-24.04-arm, rust_target: aarch64-unknown-linux-musl, vscode_targets: "linux-arm64 alpine-arm64", exe: autoformat, smoke_test: true }
    env:
      BINARY: target/${{ matrix.rust_target }}/release/${{ matrix.exe }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install musl tools
        if: contains(matrix.rust_target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p autoformat-cli --target ${{ matrix.rust_target }}
      - name: Smoke test the binary
        if: matrix.smoke_test
        shell: bash
        run: |
          "$BINARY" --version
          result=$(printf 'fn main(){let x=1;}\n' | "$BINARY" format --stdin --language rust)
          test "$result" = "fn main() { let x = 1; }"
          # The Zed extension downloads this binary and starts it as `autoformat lsp`.
          lsp_message() { printf 'Content-Length: %s\r\n\r\n%s' "${#1}" "$1"; }
          answer=$({
            lsp_message '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}'
            lsp_message '{"jsonrpc":"2.0","id":2,"method":"shutdown"}'
            lsp_message '{"jsonrpc":"2.0","method":"exit"}'
          } | "$BINARY" lsp)
          echo "$answer" | grep -q '"documentFormattingProvider":true'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package the extension
        shell: bash
        run: |
          for target in ${{ matrix.vscode_targets }}; do
            scripts/package-extension.sh "$target" "$BINARY"
          done
      - name: Archive the command line tool
        shell: bash
        run: |
          mkdir -p dist
          cp "$BINARY" LICENSE README.md THIRD_PARTY_LICENSES.md dist/
          # No version in the name, so .../releases/latest/download/<name> always works.
          name="autoformat-${{ matrix.rust_target }}"
          if [[ "${{ matrix.exe }}" == *.exe ]]; then
            (cd dist && 7z a "../$name.zip" .)
          else
            tar -czf "$name.tar.gz" -C dist .
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rust_target }}
          if-no-files-found: error
          path: |
            vscode/extension/*.vsix
            autoformat-*.zip
            autoformat-*.tar.gz

  publish:
    name: Publish v${{ needs.version.outputs.version }}
    needs: [version, build]
    if: needs.version.outputs.release == 'true' && !inputs.build_only
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and GitHub release
      id-token: write   # sign in to the Marketplace with Trusted Publishing
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: release-*
          merge-multiple: true
      - name: Collect the release files in one folder
        run: |
          mkdir -p dist
          find release -type f \( -name '*.vsix' -o -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} dist/ \;
          test "$(ls dist/*.vsix | wc -l)" -eq 8
          test "$(ls dist/autoformat-*.tar.gz dist/autoformat-*.zip | wc -l)" -eq 6
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -l dist
          cat dist/SHA256SUMS.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --skip-duplicate --packagePath dist/*.vsix
      - name: Check every platform can be downloaded
        run: |
          # The Marketplace can accept an upload and still not make it available, so
          # ask for each platform's download the same way VS Code does when installing.
          publisher=$(node -p "require('./vscode/extension/package.json').publisher")
          name=$(node -p "require('./vscode/extension/package.json').name")
          targets=""
          for file in dist/*.vsix; do
            target=$(basename "$file" | sed -E "s/^$name-(.*)-$VERSION\.vsix$/\1/")
            targets="$targets $target"
          done
          for attempt in $(seq 1 30); do
            missing=""
            for target in $targets; do
              url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$publisher/vsextensions/$name/$VERSION/vspackage?targetPlatform=$target"
              code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
              if [ "$code" != "200" ]; then
                missing="$missing $target"
              fi
            done
            if [ -z "$missing" ]; then
              echo "All platforms can be downloaded:$targets"
              exit 0
            fi
            echo "Not available yet:$missing (check $attempt of 30)"
            sleep 30
          done
          echo "::error::Published, but these platforms cannot be downloaded:$missing. The release was not tagged; run this workflow again to retry."
          exit 1
      - name: Create the tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "AutoFormat $VERSION" --generate-notes

  install-test:
    name: Install on ${{ matrix.os }}
    needs: [version, publish]
    if: needs.version.outputs.release == 'true' && !inputs.build_only
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          AUTOFORMAT_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/autoformat" --version | grep -x "autoformat $VERSION"
          "$RUNNER_TEMP/bin/autoformat" upgrade --check | tee upgrade.txt
          grep "is up to date" upgrade.txt
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:AUTOFORMAT_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          $env:AUTOFORMAT_NO_PATH_UPDATE = "1"
          ./install.ps1
          $installed = & "$env:RUNNER_TEMP\bin\autoformat.exe" --version
          if ($installed -ne "autoformat $env:VERSION") { throw "installed $installed, expected autoformat $env:VERSION" }
          $check = & "$env:RUNNER_TEMP\bin\autoformat.exe" upgrade --check
          $check
          if (-not ($check -match "is up to date")) { throw "upgrade --check did not report up to date" }
