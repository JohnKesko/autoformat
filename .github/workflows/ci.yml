name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Check the repository's own TOML files with AutoFormat
        run: cargo run -p autoformat-cli -- format --check autoformat.toml

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: cargo build --release -p autoformat-cli
      - working-directory: vscode/extension
        run: npm ci && npm run test:unit
      - name: Integration tests inside VS Code
        working-directory: vscode/extension
        run: xvfb-run -a npm run test:vscode
