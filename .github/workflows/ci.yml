name: Tests

# Runs for pull requests, and is called by the Build & Release workflow on every push to
# master.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The project's own config file is formatted
        run: cargo run -p autoformat-cli -- format --check autoformat.toml Cargo.toml

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode/extension/package-lock.json
      - run: cargo build --release -p autoformat-cli
      - name: Unit tests
        working-directory: vscode/extension
        run: npm ci && npm run test:unit
      - name: Tests inside VS Code
        working-directory: vscode/extension
        run: xvfb-run -a npm run test:vscode
